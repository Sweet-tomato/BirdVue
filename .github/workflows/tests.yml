name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install fastapi "uvicorn[standard]" python-multipart "pydantic>=2" pillow numpy scipy soundfile
      - name: Run tests
        run: python -m pytest tests/ -q
